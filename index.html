<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo-180.png?v=2" />
    <link rel="manifest" href="/manifest.json?v=2" />

    <meta name="theme-color" content="#85cc00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SiPinter" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="https://lh3.googleusercontent.com/d/1P395tuZymxs3qero4XduMpHy7g2GJrdR=w256" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
    <title>SiPinter Apps - SMAN 1 Cililin</title>
  </head>
  <body>
    <div id="root">
      <style>
        @keyframes cuteBounceInit { 0%, 100% { transform: translateY(0) scaleX(1.06) scaleY(0.94); } 45% { transform: translateY(-22px) scaleX(0.98) scaleY(1.03); } }
        @keyframes cuteWaveInit { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(18deg); } }
        @keyframes cuteTasselInit { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(20deg); } }
        .init-brand-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #85cc00;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          padding: 24px;
          overflow: hidden;
          box-sizing: border-box;
          user-select: none;
        }
        .init-brand-glow {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: 380px;
          height: 380px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.25);
          filter: blur(90px);
          pointer-events: none;
        }
        .init-brand-title {
          font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          font-size: 32px;
          font-weight: 900;
          letter-spacing: 0.05em;
          text-transform: uppercase;
          color: #ffffff;
          margin: 0;
          line-height: 1;
          text-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);
        }
        .init-brand-school {
          font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          font-size: 13px;
          font-weight: 700;
          color: #475569;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          line-height: 1.25;
          margin-top: 4px;
        }
        .init-splash-wrap {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: none;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #f8fafc;
          background-image: linear-gradient(to bottom right, rgba(236, 253, 245, 0.6), #f8fafc, rgba(133, 204, 0, 0.15));
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          color: #334155;
          padding: 24px;
          overflow: hidden;
          box-sizing: border-box;
          user-select: none;
        }
        .init-glow-1 {
          position: absolute;
          top: 25%;
          left: 25%;
          width: 384px;
          height: 384px;
          border-radius: 50%;
          background: linear-gradient(to bottom right, rgba(133, 204, 0, 0.15), rgba(52, 211, 153, 0.05));
          filter: blur(64px);
          pointer-events: none;
        }
        .init-glow-2 {
          position: absolute;
          bottom: 25%;
          right: 25%;
          width: 384px;
          height: 384px;
          border-radius: 50%;
          background: linear-gradient(to top right, rgba(16, 185, 129, 0.15), rgba(133, 204, 0, 0.05));
          filter: blur(64px);
          pointer-events: none;
        }
        .init-mascot {
          animation: cuteBounceInit 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
          transform-origin: center bottom;
          width: 150px;
          height: 150px;
          filter: drop-shadow(0 4px 6px rgba(15, 23, 42, 0.08));
        }
        .init-wave {
          animation: cuteWaveInit 1.3s ease-in-out infinite;
          transform-origin: 28px 110px;
        }
        .init-tassel {
          animation: cuteTasselInit 1.6s ease-in-out infinite;
          transform-origin: 80px 37px;
        }
        .init-brand-cute {
          font-family: 'Fredoka', ui-rounded, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          font-size: 30px;
          font-weight: 700;
          letter-spacing: -0.02em;
          line-height: 1.1;
          margin-top: 12px;
          display: inline-flex;
          align-items: center;
          gap: 3px;
          filter: drop-shadow(0 2px 10px rgba(133, 204, 0, 0.22));
        }
        .init-brand-cute-si {
          color: #1e293b;
        }
        .init-brand-cute-pinter {
          background: linear-gradient(135deg, #68a300 0%, #85cc00 50%, #10b981 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        .init-sub {
          font-size: 14px;
          color: #475569;
          margin-top: 6px;
          font-weight: 600;
          text-align: center;
          max-width: 340px;
          line-height: 1.5;
        }
      </style>
      <div id="init-brand-splash" class="init-brand-splash">
        <div class="init-brand-glow"></div>
        <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; text-align: center;">
          <div style="width: 112px; height: 112px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; position: relative;">
            <div style="position: absolute; inset: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); filter: blur(20px); pointer-events: none;"></div>
            <img src="https://lh3.googleusercontent.com/d/1P395tuZymxs3qero4XduMpHy7g2GJrdR=w256" alt="Logo SMA Negeri 1 Cililin" style="position: relative; z-index: 10; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 24px rgba(15, 23, 42, 0.18));" referrerpolicy="no-referrer" />
          </div>
          <h1 class="init-brand-title">SIPINTER APP</h1>
          <p class="init-brand-school">SMA NEGERI 1 CILILIN</p>
        </div>
      </div>
      <div id="init-mascot-loader" class="init-splash-wrap">
        <div class="init-glow-1"></div>
        <div class="init-glow-2"></div>
        <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; text-align: center;">
          <svg class="init-mascot" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="80" cy="148" rx="36" ry="6" fill="rgba(15, 23, 42, 0.14)" />
            <g>
              <ellipse cx="62" cy="140" rx="10" ry="6" fill="#4d7c0f" />
              <ellipse cx="98" cy="140" rx="10" ry="6" fill="#4d7c0f" />
              <ellipse cx="118" cy="98" rx="7" ry="5.5" fill="#76b900" />
              <g class="init-wave">
                <ellipse cx="32" cy="98" rx="8" ry="6" fill="#76b900" />
                <circle cx="26" cy="92" r="3.5" fill="#85cc00" />
              </g>
              <ellipse cx="80" cy="96" rx="44" ry="43" fill="#85cc00" />
              <ellipse cx="80" cy="104" rx="30" ry="26" fill="#f4fee0" />
              <ellipse cx="80" cy="50" rx="22" ry="7" fill="#0f172a" />
              <polygon points="80,24 122,37 80,50 38,37" fill="#1e293b" />
              <ellipse cx="80" cy="37" rx="4.5" ry="3" fill="#334155" />
              <g class="init-tassel">
                <path d="M 80 37 Q 100 40 106 54" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" fill="none" />
                <ellipse cx="106" cy="57" rx="3.5" ry="5.5" fill="#fbbf24" />
              </g>
              <circle cx="64" cy="86" r="9" fill="#0f172a" />
              <circle cx="61.5" cy="83.5" r="3.2" fill="#ffffff" />
              <circle cx="66.5" cy="88.5" r="1.4" fill="#ffffff" />
              <circle cx="96" cy="86" r="9" fill="#0f172a" />
              <circle cx="93.5" cy="83.5" r="3.2" fill="#ffffff" />
              <circle cx="98.5" cy="88.5" r="1.4" fill="#ffffff" />
              <ellipse cx="50" cy="96" rx="6.5" ry="4" fill="#ff6b8b" />
              <ellipse cx="110" cy="96" rx="6.5" ry="4" fill="#ff6b8b" />
              <path d="M 72 95 Q 80 106 88 95" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" fill="#e11d48" />
            </g>
          </svg>
          <div class="init-brand-cute">
            <span class="init-brand-cute-si">Si</span><span class="init-brand-cute-pinter">Pinter</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="margin-top: -12px; margin-left: 1px;">
              <path d="M12 2L14.2 9.2L21.5 11.5L14.2 13.8L12 21L9.8 13.8L2.5 11.5L9.8 9.2L12 2Z" fill="#facc15" />
            </svg>
          </div>
          <div class="init-sub">Tunggu Sebentar Yaaa. Sedang Memuat Halaman Dulu</div>
        </div>
      </div>
      <script>
        (function() {
          try {
            var isDash = window.location.pathname.indexOf('/dashboard') === 0;
            var hasTeacher = sessionStorage.getItem('is_teacher_auth') === 'true' || localStorage.getItem('is_teacher_auth') === 'true';
            var hasStudent = false;
            try {
              var rawStu = localStorage.getItem('current_student');
              if (rawStu) {
                var parsedStu = JSON.parse(rawStu);
                hasStudent = Boolean(parsedStu && (parsedStu.nisn || parsedStu.id));
              }
            } catch (_) {}
            var navType = 'navigate';
            try {
              var navEntries = window.performance && window.performance.getEntriesByType && window.performance.getEntriesByType('navigation');
              if (navEntries && navEntries.length > 0 && navEntries[0].type) {
                navType = navEntries[0].type;
              } else if (window.performance && window.performance.navigation) {
                navType = window.performance.navigation.type === 1 ? 'reload' : 'navigate';
              }
            } catch (_) {}
            var isReload = navType === 'reload';
            var hasSeenSplash = sessionStorage.getItem('sipinter_splash_seen_v2') === 'true';
            if (isDash || hasTeacher || hasStudent || (isReload && hasSeenSplash)) {
              var b = document.getElementById('init-brand-splash');
              var m = document.getElementById('init-mascot-loader');
              if (b) b.style.display = 'none';
              if (m) m.style.display = 'flex';
            } else {
              window.__sipinterBrandSplashStart = Date.now();
            }
          } catch (_) {}
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
  </body>
</html>
